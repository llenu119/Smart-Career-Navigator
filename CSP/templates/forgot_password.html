{% extends "base.html" %}
{% block title %}Forgot Password - Smart Career Navigator{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card">
            <!-- Header -->
            <div class="text-center mb-4">
                <div class="auth-icon mb-3">
                    <i class="bi bi-key"></i>
                </div>
                <h3 class="fw-700">Forgot Password</h3>
                <p class="text-muted small">Enter your email and we'll send you an OTP to reset your password.</p>
            </div>

            <!-- Forgot Password Form -->
            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <div class="mb-3">
                    <label for="email" class="form-label fw-500">
                        <i class="bi bi-envelope me-1"></i>Email Address
                    </label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email"
                           placeholder="your.email@example.com" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">
                    <i class="bi bi-send me-2"></i>Send Reset OTP
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="fw-600">
                    <i class="bi bi-arrow-left me-1"></i>Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
