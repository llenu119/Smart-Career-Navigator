{% extends "base.html" %}
{% block title %}Register - Smart Career Navigator{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card">
            <!-- Header -->
            <div class="text-center mb-4">
                <div class="auth-icon mb-3">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h3 class="fw-700">Create Account</h3>
                <p class="text-muted small">Join Smart Career Navigator and discover your path</p>
            </div>

            <!-- Registration Form -->
            <form method="POST" action="{{ url_for('auth.register') }}" data-password-strength="true" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label fw-500">
                        <i class="bi bi-person me-1"></i>Username
                    </label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username"
                        placeholder="Choose a username (min 3 characters)" minlength="3" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-500">
                        <i class="bi bi-envelope me-1"></i>Email Address
                    </label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email"
                        placeholder="your.email@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-500">
                        <i class="bi bi-lock me-1"></i>Password
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg" id="password" name="password"
                            placeholder="At least 8 characters" minlength="8" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password')">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label fw-500">
                        <i class="bi bi-lock-fill me-1"></i>Confirm Password
                    </label>
                    <input type="password" class="form-control form-control-lg" id="confirm_password"
                        name="confirm_password" placeholder="Re-enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">
                    <i class="bi bi-person-plus me-2"></i>Create Account
                </button>
            </form>

            <!-- Login Link -->
            <div class="text-center mt-4">
                <p class="text-muted mb-1">Already have an account?</p>
                <a href="{{ url_for('auth.login') }}" class="fw-600">Login <i class="bi bi-arrow-right"></i></a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/password-strength.js') }}"></script>
{% endblock %}
