{% extends "base.html" %}
{% block title %}Reset Password - Smart Career Navigator{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card">
            <!-- Header -->
            <div class="text-center mb-4">
                <div class="auth-icon mb-3">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h3 class="fw-700">Reset Password</h3>
                <p class="text-muted small">Enter the code sent to <strong>{{ email }}</strong> and your new password.</p>
            </div>

            <!-- Reset Password Form -->
            <form method="POST" action="{{ url_for('auth.reset_password') }}" data-password-strength="true" novalidate>
                <div class="mb-3">
                    <label for="otp" class="form-label fw-500">
                        <i class="bi bi-hash me-1"></i>Verification Code
                    </label>
                    <input type="text" class="form-control form-control-lg text-center tracking-widest fw-bold" 
                           id="otp" name="otp" placeholder="000000" maxlength="6" pattern="\d{6}" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-500">
                        <i class="bi bi-lock me-1"></i>New Password
                    </label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password"
                           placeholder="At least 8 characters" minlength="8" required>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label fw-500">
                        <i class="bi bi-lock-fill me-1"></i>Confirm New Password
                    </label>
                    <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password"
                           placeholder="Re-type new password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">
                    <i class="bi bi-check-circle me-2"></i>Reset Password
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-1">Didn't receive the code?</p>
                <a href="{{ url_for('auth.resend_otp') }}" class="fw-600">
                    <i class="bi bi-arrow-clockwise me-1"></i>Resend Code
                </a>
            </div>

            <div class="text-center mt-3">
                <a href="{{ url_for('auth.login') }}" class="text-muted small">
                    <i class="bi bi-arrow-left me-1"></i>Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/password-strength.js') }}"></script>
{% endblock %}
